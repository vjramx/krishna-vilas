<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App-like viewport: no pinch/double-tap zoom, notch-safe, keyboard resizes the app content. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#C83E24" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Krishna Vilas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no,address=no,email=no,date=no" />
    <meta name="description" content="Order food online from Krishna Vilas — South Indian meals, dosa, biryani and more. Cash on Delivery." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Krishna Vilas</title>
    <style>
      /* Native launch screen — painted before any JS so the app never flashes white. */
      html,
      body {
        margin: 0;
        background: #c83e24;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: linear-gradient(160deg, #c83e24 0%, #a83318 55%, #8f2a13 100%);
        color: #fff;
        font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }
      #boot-splash[data-hide='true'] {
        opacity: 0;
        visibility: hidden;
      }
      #boot-splash .mark {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        object-fit: contain;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
        animation: boot-pop 520ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      #boot-splash .name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      #boot-splash .sub {
        font-size: 12px;
        opacity: 0.78;
        margin-top: -8px;
      }
      #boot-splash .bar {
        width: 96px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.25);
      }
      #boot-splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #fff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pop {
        from {
          opacity: 0;
          transform: scale(0.82);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .mark,
        #boot-splash .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Krishna Vilas is starting">
      <img class="mark" src="/icon-192.png" alt="" aria-hidden="true" width="84" height="84" />
      <div class="name">Krishna Vilas</div>
      <div class="sub">ಕೃಷ್ಣ ವಿಲಾಸ್</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
